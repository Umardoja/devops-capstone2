[SERVICE]
    Flush 1
    Daemon Off
    Log_Level info
    Parsers_File /fluent-bit/etc/parsers_custom.conf

[INPUT]
    Name tail
    Path /var/log/demo/app.jsonl
    Parser capstone_json
    Tag demo-api
    Refresh_Interval 2
    Read_from_Head On
    DB /tmp/capstone2-tail-state.db

[OUTPUT]
    Name loki
    Match demo-api
    Host loki
    Port 3100
    Labels job=capstone2,service=$service,level=$level
    Line_Format json
    Retry_Limit False
